[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engram-sdk"
version = "0.1.0"
description = "Python SDK for the Engram cognitive memory system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["engram"]
